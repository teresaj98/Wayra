# iOS simulator build, started by hand on the dev branch only (owner decision DEC-S2-11; PRD 01 F-10). Choices: docs/decisions.md DEC-S2-02, -03, -07.
# Actions are pinned to full commit SHAs; the comment after each SHA is its release tag.
name: iOS simulator build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0'
  LANG: en_US.UTF-8 # CocoaPods fails with an encoding error without it (DEC-S1-13)

jobs:
  ios:
    name: iOS simulator build (Debug)
    # Owner decision DEC-S2-11: manual runs on the dev branch only.
    if: github.ref == 'refs/heads/dev'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create env files (git-ignored, from .env.example)
        run: npm run env:init && node scripts/env.js check staging
      # Same Ruby and Bundler as Gemfile.lock (2.6.10, 1.17.2), so CocoaPods 1.15.2 resolves exactly as on the owner's Mac.
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: '2.6.10'
          bundler-cache: true
      - name: Show Xcode (26 or later required, D-022)
        run: xcodebuild -version
      - name: pod install
        working-directory: ios
        run: bundle exec pod install
      - name: Build for the iOS simulator
        env:
          ENVFILE: .env.staging
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Wayra.xcworkspace \
            -scheme Wayra \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build
