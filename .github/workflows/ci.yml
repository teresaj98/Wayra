# CI for every push and pull request (PRD 01 F-10, AC-13). Choices: docs/decisions.md DEC-S2-01 to -06.
# Actions are pinned to full commit SHAs; the comment after each SHA is its release tag.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: '0' # no git hooks on CI machines

jobs:
  checks:
    name: Lint, typecheck, tests, db:check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Lint (ESLint, import-boundary self-check, app identity check)
        run: npm run lint
      - run: npm run typecheck
      - run: npm test -- --ci
      - run: npm run db:check

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Create env files (git-ignored, from .env.example)
        run: npm run env:init && node scripts/env.js check staging
      # Gradle downloads and runs on its own Java 25 (DEC-S1-17); the runner's default JDK 17 only starts the wrapper.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          cache-provider: basic
      - name: Build debug APK with the JS bundle embedded (DEC-S2-06)
        working-directory: android
        env:
          ENVFILE: .env.staging
        run: ./gradlew app:assembleDebug -PwayraEmbedJsInDebug --no-daemon
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wayra-staging-debug-apk-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
